<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Calendrier">
  <!-- Icône de l'extension : un calendrier, bleu UdeM (#0f56a9), sans texte.
       Dessiné en aplats épais pour rester lisible une fois réduit à 16 px :
       la silhouette (deux anneaux + bandeau plein) porte la reconnaissance,
       les marques intérieures ne sont qu'une texture à cette taille. -->
  <title>Synchro Calendrier UdeM</title>

  <!-- Anneaux de reliure -->
  <rect x="34" y="6" width="12" height="28" rx="6" fill="#0f56a9" />
  <rect x="82" y="6" width="12" height="28" rx="6" fill="#0f56a9" />

  <!-- Corps du calendrier : bandeau bleu plein, puis page blanche -->
  <rect x="10" y="20" width="108" height="98" rx="14" fill="#0f56a9" />
  <path d="M10 52 H118 V104 a14 14 0 0 1 -14 14 H24 a14 14 0 0 1 -14 -14 Z" fill="#ffffff" />

  <!-- Marques de la page : un jour mis en évidence et deux lignes -->
  <rect x="26" y="62" width="26" height="26" rx="6" fill="#0f56a9" />
  <rect x="62" y="68" width="40" height="14" rx="7" fill="#0f56a9" />
  <rect x="26" y="96" width="76" height="12" rx="6" fill="#0f56a9" opacity="0.55" />
</svg>
